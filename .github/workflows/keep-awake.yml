name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python .github/scripts/keep_awake.py
        env:
          APP_URLS: |
            https://diabetes-prediction-yemi.streamlit.app/
            https://yemifatodu-arbitrage-iq.streamlit.app/
            https://yemifatodu-bank-churn-predictor.streamlit.app/
            https://yemifatodu-smart-eda-dashboard.streamlit.app/